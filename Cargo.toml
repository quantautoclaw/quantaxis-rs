[package]
name = "quantaxis-rs"
version = "0.3.4"
description = 'quantaxis in rust'
authors = ["yutiansut <yutiansut@qq.com>"]
edition = "2018"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md"
]
readme = "README.md"
categories = ["science", "algorithms"]
homepage = "https://github.com/yutiansut"
repository = "https://github.com/yutiansut/quantaxis-rs"
documentation = "https://docs.rs/quantaxis-rs/"
license = "MIT OR Apache-2.0"

[dependencies]
serde_json = "1.0.61"
serde_derive = "1.0"
serde = { version = "1.0", features = ["derive"] } # 序列化
csv = "1.1.3"
# stopwatch 已移除 - 使用 chrono 或 std::time 替代
num = "0.4"
num-traits = "0.2"
rayon = "1.1" # 多线程
ndarray = "0.16"
ndarray-csv = "0.5"
log = "0.4"
error-chain = "0.12"
regex = "1"
uuid = { version = "1.0", features = ["serde", "v1", "v4"] }
float-cmp = "0.4.0"
bencher = "0.1.5"
rand = "0.8"
qifi-rs ="0.3.0"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

[lib]
name = "quantaxis_rs"
crate-type = ["lib", "cdylib"]

[dependencies.pyo3]
version = "0.22"
optional = true
features = ["extension-module"]

[features]
default = []
python = ["pyo3"]




[[bench]]
name = "indicators"
path = "benches/indicators.rs"
harness = false

